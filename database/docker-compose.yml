version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: calth_reader_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-calth_reader}
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-CalthReader2024!}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=C --lc-ctype=C"
      TZ: Asia/Seoul
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
      - ./data:/backup
    networks:
      - calth_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-calth_reader}"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    command: >
      postgres
      -c log_statement=all
      -c log_destination=stderr
      -c log_line_prefix='%t [%p]: [%l-1] user=%u,db=%d,app=%a,client=%h '
      -c log_min_duration_statement=1000
      -c shared_preload_libraries=pg_stat_statements

  adminer:
    image: adminer:latest
    container_name: calth_reader_adminer
    restart: unless-stopped
    ports:
      - "${ADMINER_PORT:-8080}:8080"
    networks:
      - calth_network
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DESIGN: lucas

volumes:
  postgres_data:
    driver: local
    name: calth_reader_postgres_data

networks:
  calth_network:
    driver: bridge
    name: calth_reader_network
