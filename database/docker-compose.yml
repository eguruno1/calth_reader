version: '3.3'

services:
  postgres:
    image: postgres:15-alpine
    container_name: calth_reader_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: calth_reader
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: CalthReader2024!
      TZ: Asia/Seoul
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d
      - ./data:/backup
    networks:
      - calth_network
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "admin"]
      interval: 30s
      timeout: 10s
      retries: 3

  adminer:
    image: adminer:latest
    container_name: calth_reader_adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    networks:
      - calth_network
    depends_on:
      - postgres
    environment:
      ADMINER_DEFAULT_SERVER: postgres

volumes:
  postgres_data:

networks:
  calth_network:
